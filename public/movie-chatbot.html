<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Assistant Chatbot</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --bot-bubble: #334155;
            --user-bubble: #6366f1;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 600px;
            background-color: var(--card-bg);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .chat-header {
            padding: 1.5rem;
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .bot-avatar {
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .header-info h2 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .header-info p {
            margin: 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            position: relative;
            group: hover;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            position: relative;
            margin-bottom: 0.5rem;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-bubble);
            border-bottom-left-radius: 0.2rem;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            border-bottom-right-radius: 0.2rem;
        }

        .message-actions {
            display: flex;
            visibility: hidden;
            opacity: 0;
            gap: 12px;
            margin-top: 4px;
            padding: 0 8px;
            transition: all 0.2s ease;
        }

        .message-wrapper.user-wrapper .message-actions {
            align-self: flex-end;
        }

        .message-wrapper:hover .message-actions {
            visibility: visible;
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            font-size: 0.9rem;
            width: auto;
            height: auto;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .action-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }

        .chat-input {
            padding: 1.2rem;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 0.8rem;
        }

        input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 0.8rem 1.2rem;
            color: white;
            font-family: inherit;
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="bot-avatar">🤖</div>
            <div class="header-info">
                <h2>Movie Assistant</h2>
                <p>Online | Ask me anything!</p>
            </div>
        </div>
        
        <div id="messages" class="chat-messages">
            <div class="message bot">
                👋 Hi! I'm your Movie Assistant. How can I help you today?
            </div>
        </div>

        <form id="chat-form" class="chat-input">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>

    <script>
        const socket = io('/chatbot', {
            path: '/socket.io'
        });

        const messagesContainer = document.getElementById('messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        let editingMessage = null;
        let editingBotResponse = null;

        function appendMessage(text, isBot) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper' + (isBot ? '' : ' user-wrapper');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isBot ? 'bot' : 'user'}`;
            msgDiv.innerText = text;

            wrapper.appendChild(msgDiv); // Append message first

            if (!isBot) {
                const actions = document.createElement('div');
                actions.className = 'message-actions';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.innerHTML = '✎';
                editBtn.title = 'Edit message';
                editBtn.onclick = () => {
                    userInput.value = text;
                    userInput.focus();
                    editingMessage = wrapper;
                    
                    // Also find and prepare to replace the next bot message
                    const nextMsg = wrapper.nextElementSibling;
                    if (nextMsg && nextMsg.querySelector('.message.bot')) {
                        editingBotResponse = nextMsg;
                    }
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'action-btn';
                delBtn.innerHTML = '🗑';
                delBtn.title = 'Delete message';
                delBtn.onclick = () => {
                    // Delete user message and the following bot response if it exists
                    const nextMsg = wrapper.nextElementSibling;
                    if (nextMsg && nextMsg.querySelector('.message.bot')) {
                        nextMsg.remove();
                    }
                    wrapper.remove();
                };

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                wrapper.appendChild(actions);
            }

            wrapper.appendChild(msgDiv);
            messagesContainer.appendChild(wrapper);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (text) {
                if (editingMessage) {
                    editingMessage.querySelector('.message').innerText = text;
                    editingMessage = null;
                } else {
                    appendMessage(text, false);
                }
                socket.emit('message', { text });
                userInput.value = '';
            }
        };

        socket.on('reply', (data) => {
            if (editingBotResponse) {
                editingBotResponse.querySelector('.message').innerText = data.text;
                editingBotResponse = null;
            } else {
                appendMessage(data.text, true);
            }
        });

        socket.on('connect', () => {
            console.log('Connected to chatbot');
        });

        socket.on('error', (err) => {
            console.error('Socket error:', err);
        });
    </script>
</body>
</html>
